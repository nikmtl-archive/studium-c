<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freunde Buch</title>
    <meta name="description" content="Ein Freundebuch Formular">
    <meta name="author" content="Dominik">
    <link rel="stylesheet" href="css.css">
    <script src="js.js" defer></script>
    <link rel="icon" type="image/png" href="logo.png">
</head>

<body onload="onload()">
    <header>
        <img src="logo.png" alt="logo" width="60">
        <h1>Mein Freundebuch</h1>
        <button onclick="openNewEntryForm()">Neuer Eintrag</button>
    </header>
    <div id="new_entry" style="display: none;">
        <form id="new_entry_form" onsubmit="addEntry(event)">
            <h2>Neuer Eintrag</h2>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br>
            <label for="geburtstag">Geburtstag:</label>
            <input type="date" id="geburtstag" name="geburtstag"><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email"><br>
            <label for="telefon">Telefon:</label>
            <input type="tel" id="telefon" name="telefon"><br>
            <label for="website">Website:</label>
            <input type="url" id="website" name="website"><br>
            <label for="verhältnis">Verhältnis:</label>
            <select name="verhältnis" id="verhältnis">
                <option value="" disabled selected>Bitte wählen</option>
                <option value="freund">Freund</option>
                <option value="familie">Familie</option>
            </select><br>

            <label for="lieblingslied">Lieblings Lied:</label>
            <input type="text" id="lieblingslied" name="lieblingslied"><br>

            <label for="musiklautstärke">Lieblings Musik Lautstärke:</label>
            <input type="range" id="musiklautstärke" name="musiklautstärke" min="0" max="100"><br>

            <label for="lieblingszeit">Lieblingszeit:</label>
            <input type="time" id="lieblingszeit" name="lieblingszeit"><br>

            <label for="profilbild">Profilbild hochladen:</label>
            <input type="file" id="profilbild" name="profilbild"><br>
            <label for="lieblingsfarbe">Lieblingsfarbe:</label>
            <input type="color" id="lieblingsfarbe" name="lieblingsfarbe"><br>
            <fieldset>
                <legend>Entscheide dein Lieblingstier</legend>
                <input type="radio" name="lieblingstier" id="hund" value="hund">
                <label for="hund">Hund</label>
                <input type="radio" name="lieblingstier" id="katze" value="katze">
                <label for="katze">Katze</label>
            </fieldset><br>
            <div id="geschmack_entscheidung">
                <fieldset>
                    <legend>Entscheide: Lieblingsessen</legend>
                    <input type="radio" name="lieblingsessen" id="pizza" value="pizza">
                    <label for="pizza">Pizza</label>
                    <input type="radio" name="lieblingsessen" id="burger" value="burger">
                    <label for="burger">Burger</label>
                    <input type="radio" name="lieblingsessen" id="pasta" value="pasta">
                    <label for="pasta">Pasta</label>
                </fieldset><br>
                <fieldset>
                    <legend>Entscheide: Lieblingsgetränk</legend>
                    <input type="radio" name="lieblingsgetränk" id="wasser" value="wasser">
                    <label for="wasser">Wasser</label>
                    <input type="radio" name="lieblingsgetränk" id="cola" value="cola">
                    <label for="cola">Cola</label>
                    <input type="radio" name="lieblingsgetränk" id="fanta" value="fanta">
                    <label for="fanta">Fanta</label>
                    <input type="radio" name="lieblingsgetränk" id="sprite" value="sprite">
                    <label for="sprite">Sprite</label>
                </fieldset><br>
            </div>
            <label for="lieblingsgeschichte">Lieblingsgeschichte:</label>
            <textarea name="lieblingsgeschichte" id="lieblingsgeschichte" cols="30" rows="10"></textarea><br>
            
            
            <label for="nachricht">Nachricht:</label>
            <textarea name="nachricht" id="nachricht" cols="30" rows="10"></textarea><br>
            <div id="submit_buttons_div">
                <button type="button" onclick="closeNewEntryForm()" id="cancel_button">Abbrechen</button>
                <button type="submit">Eintragen</button>
            </div>
        </form>
    </div>
    <h2>Meine Freunde</h2>
    <div id="entries">
        <!-- Hier werden die Einträge eingefügt -->
    </div>
</body>

</html>
